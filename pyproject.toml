[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dura-reproduction"
version = "0.2.0"
description = "Independent code reproduction of Hidden in Plain Sight (DURA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
models = ["diffusers==0.30.3", "transformers==4.40.1", "accelerate==0.34.2", "torchvision==0.17.2", "timm==0.9.10", "sentencepiece==0.2.0", "huggingface-hub==0.25.2"]

[project.scripts]
dura = "dura.cli:main"

[tool.setuptools.packages.find]
include = ["dura*"]
